<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Xynapse quick chat</title>
<style>
  :root { --v: #8d93ff; --c: #6ee7ef; --ink: #f4f4f6; --mute: #8d8d9a; --line: rgba(255,255,255,.09) }
  * { box-sizing: border-box }
  [hidden] { display: none !important }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 15px/1.55 'Segoe UI', system-ui, sans-serif; color: var(--ink); user-select: none }
  body { padding: 0 }

  .card { overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(180deg, rgba(31,31,37,.98), rgba(20,20,25,.98)) }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 0 22px; color: var(--mute); font-size: .76rem; letter-spacing: .08em; text-transform: uppercase }
  .top button { margin-left: 4px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--mute); font: inherit; letter-spacing: normal; text-transform: none; cursor: pointer }
  .top button:hover { background: rgba(255,255,255,.07); color: #fff }

  .msgs { max-height: 410px; overflow-y: auto; padding: 6px 22px 6px; user-select: text; scrollbar-width: thin; scrollbar-color: #34343c transparent }
  .m { margin: 10px 0; word-wrap: break-word; overflow-wrap: anywhere }
  .m.user { width: fit-content; max-width: 88%; margin-left: auto; padding: 8px 14px; border-radius: 16px 16px 4px 16px; background: color-mix(in srgb, var(--v) 18%, transparent) }
  .m.bot { color: #e6e6ec }
  .m code { padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.08); font: .88em Consolas, 'Cascadia Mono', monospace; color: var(--c) }
  .m pre { margin: 8px 0; padding: 10px 12px; overflow-x: auto; border-radius: 12px; background: rgba(0,0,0,.4); border: 1px solid var(--line) }
  .m pre code { padding: 0; background: none; color: #dcdcf0 }
  .m .h { display: block; margin-top: 6px; font-size: 1.04em }
  .err { color: #ff9a9a }
  .link { margin-left: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--c); font: inherit; font-size: .85rem; cursor: pointer }
  .think { display: inline-flex; align-items: center; gap: 5px; color: var(--mute); font-size: .88rem }
  .think i { width: 6px; height: 6px; border-radius: 50%; background: var(--v); animation: pulse 1.1s infinite ease-in-out }
  .think i:nth-child(2) { animation-delay: .15s } .think i:nth-child(3) { animation-delay: .3s }
  .think em { margin-left: 4px; font-style: normal }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8) } 40% { opacity: 1; transform: scale(1) } }

  .bar { display: flex; align-items: center; gap: 14px; height: 72px; padding: 0 16px 0 22px }
  .bar + .msgs, .msgs + .bar { border-top: 1px solid var(--line) }
  .mark { flex: 0 0 auto; width: 28px; height: 28px; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--v) 55%, transparent)) }
  #in { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 1.15rem; user-select: text }
  #in::placeholder { color: var(--mute) }
  #act { flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 50%; background: linear-gradient(135deg, var(--v), var(--c)); color: #07070a; cursor: pointer; transition: opacity .15s, transform .15s }
  #act:hover { transform: scale(1.06) }
  #act.idle { opacity: .28; cursor: default; transform: none }
  #act svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round }
  #act .stop { fill: currentColor; stroke: none }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top" id="top" hidden>
    <span>Quick chat</span>
    <span><button id="open" type="button" title="Open the full app">Open app</button><button id="new" type="button" title="New chat (Ctrl+N)">New chat</button></span>
  </div>
  <div class="msgs" id="msgs" hidden></div>
  <div class="bar">
    <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="3.4" fill="#fff" stroke="none"/><path d="M6 6l7.2 7.2M26 6l-7.2 7.2M6 26l7.2-7.2M26 26l-7.2-7.2" stroke="var(--v)"/></svg>
    <input id="in" type="text" placeholder="What can I help you with today?" autocomplete="off" spellcheck="false" maxlength="4000">
    <button id="act" class="idle" type="button" title="Send"><svg id="icoSend" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg id="icoStop" class="stop" viewBox="0 0 24 24" hidden><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var card = $('card'), top = $('top'), msgsEl = $('msgs'), inp = $('in'), act = $('act');
  var convo = [], busy = false, reqId = 0, cur = null;

  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function inline(s) {
    return s
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/^#{1,6}\s+(.*)$/gm, '<b class="h">$1</b>')
      .replace(/^\s*[-*]\s+/gm, '• ')
      .replace(/\n/g, '<br>');
  }
  function md(src) {
    return src.split('```').map(function (part, i) {
      return i % 2 ? '<pre><code>' + esc(part.replace(/^[^\n]*\n/, '')) + '</code></pre>' : inline(esc(part));
    }).join('');
  }

  function fit() { window.overlay.resize(Math.ceil(card.getBoundingClientRect().height)); }
  new ResizeObserver(fit).observe(card);
  function scrollEnd() { msgsEl.scrollTop = msgsEl.scrollHeight; }

  function syncButton() {
    $('icoSend').hidden = busy;
    $('icoStop').hidden = !busy;
    act.title = busy ? 'Stop (Esc)' : 'Send';
    act.classList.toggle('idle', !busy && !inp.value.trim());
  }
  function setBusy(value) { busy = value; syncButton(); }

  function addUser(text) {
    var d = document.createElement('div');
    d.className = 'm user';
    d.textContent = text;
    msgsEl.appendChild(d);
  }
  function addAssistant() {
    var d = document.createElement('div');
    d.className = 'm bot';
    d.innerHTML = '<span class="think"><i></i><i></i><i></i><em></em></span>';
    msgsEl.appendChild(d);
    return { el: d, text: '', failed: false };
  }

  function submit() {
    if (busy) return;
    var text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    convo.push({ role: 'user', content: text });
    msgsEl.hidden = false;
    top.hidden = false;
    addUser(text);
    cur = addAssistant();
    setBusy(true);
    window.overlay.send(++reqId, convo.slice(-30));
    scrollEnd();
  }

  function cancel() {
    if (!busy) return;
    window.overlay.cancel();
    reqId++; // ignore anything still in flight
    if (cur) {
      if (cur.text) convo.push({ role: 'assistant', content: cur.text });
      else { convo.pop(); cur.el.remove(); }
    }
    cur = null;
    setBusy(false);
  }

  function newChat() {
    cancel();
    convo = [];
    msgsEl.innerHTML = '';
    msgsEl.hidden = true;
    top.hidden = true;
    inp.focus();
  }

  window.overlay.onEvent(function (ev) {
    if (ev.id !== reqId || !cur) return;
    if (ev.type === 'status' || ev.type === 'thought') {
      var em = cur.el.querySelector('em');
      if (em && !cur.text) em.textContent = String(ev.text || '').slice(0, 60);
    } else if (ev.type === 'delta') {
      cur.text += ev.text;
      cur.el.innerHTML = md(cur.text);
      scrollEnd();
    } else if (ev.type === 'error') {
      cur.failed = true;
      cur.el.innerHTML = '<span class="err">' + esc(String(ev.message || 'Something went wrong.')) + '</span>' + (ev.code === 'auth' ? '<button class="link" id="signin" type="button">Open Xynapse</button>' : '');
      var btn = cur.el.querySelector('#signin');
      if (btn) btn.onclick = function () { window.overlay.openApp(); };
      scrollEnd();
    } else if (ev.type === 'end') {
      if (cur.failed) convo.pop(); // the question was not answered; it can be asked again
      else if (cur.text) convo.push({ role: 'assistant', content: cur.text });
      else { convo.pop(); cur.el.innerHTML = '<span class="err">No reply. Try again.</span>'; }
      cur = null;
      setBusy(false);
      inp.focus();
    }
  });

  window.overlay.onShow(function (theme) {
    if (theme) {
      if (theme.v) document.documentElement.style.setProperty('--v', theme.v);
      if (theme.c) document.documentElement.style.setProperty('--c', theme.c);
    }
    inp.focus();
    inp.select();
    fit();
  });

  inp.addEventListener('input', syncButton);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  act.addEventListener('click', function () { if (busy) cancel(); else submit(); });
  $('new').addEventListener('click', newChat);
  $('open').addEventListener('click', function () { window.overlay.openApp(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); if (busy) cancel(); else window.overlay.hide(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); newChat(); }
  });

  syncButton();
  fit();
})();
</script>
</body>
</html>
